  var m=await db.doc("meta/init").get();
  if(!m.exists){
   var mk=function(n,c,t,w,s,a){return{id:"seed"+n,bay:"act",pos:"twr",dir:"in",cs:c,ty:t,wk:w,sp:s,ap:a,n:"",wide:"",cells:["","","","","","","",""]}};
   var L=[mk(1,"VMP461","BT-67","M","210","VTPP"),mk(2,"RTAF111","C130","M","290","VTST"),mk(3,"MTN6312","TEX2","L","300","VTUD"),mk(4,"SNSH209","C172","L","110","VTCL")];
   for(var i=0;i<L.length;i++){var o=Object.assign({},L[i],{ord:i});await db.doc("strips/"+o.id).set(o)}
   await db.doc("meta/init").set({seeded:true})}
 }catch(e){}
 seeding=false;
}
function onStrips(snap){
 if(snap.metadata&&snap.metadata.fromCache&&snap.empty)return;
 if(dirty||writing){missed=true;return}
 if(snap.empty){if(first){first=false;strips=[];render()}seed();return}
 apply(snap)}

/* ---------- room: live pilots + roster ---------- */
function usedCs(){var u={};peersCache.forEach(function(p){if(!p.isMe&&p.presence&&p.presence.cs)u[p.presence.cs]=1});return u}
var _opts=opts;
opts=function(){var sel=$p("pa"),v=sel&&sel.value;_opts.apply(this,arguments);sel=$p("pa");if(!sel)return;
 var u=usedCs();Array.prototype.forEach.call(sel.options,function(o){if(o.value&&u[o.value]){o.disabled=true;o.textContent+=" — มีคนบินอยู่"}});
 if(v&&!u[v])sel.value=v};
var _dp=drawPl;
drawPl=function(){_dp.apply(this,arguments);drawPeers()};
function drawPeers(){
 var m=$p("map");if(!m)return;var g=$p("plr");
 if(!g){g=document.createElementNS("http://www.w3.org/2000/svg","g");g.id="plr";g.style.pointerEvents="none";m.appendChild(g)}
 var u=upp(),o="";
 peersCache.forEach(function(q){var p=q.presence;if(q.isMe||!p||!p.cs||typeof p.x!=="number")return;
  var X=p.y,Y=-p.x;
  o+='<path d="M9,0L-6,-5L-3,0L-6,5z" transform="translate('+f1(X)+' '+f1(Y)+') rotate('+f1(p.hd/DEG-90)+') scale('+f1(1.6*u)+')" fill="#ffb347" stroke="#0a1a26" stroke-width=".8"/>'
   +'<text x="'+f1(X+14*u)+'" y="'+f1(Y-10*u)+'" font-size="'+f1(11*u)+'" fill="#ffb347" stroke="#0a1a26" stroke-width="'+f1(3*u)+'" paint-order="stroke" font-family="Courier Prime,monospace" font-weight="700">'+esc(String(p.cs))+" "+(Math.round((p.z||0)/100)*100)+"ft "+Math.round(p.v||0)+"kt</text>"});
 g.innerHTML=o}
function myRole(){var rb=$p("rolebar");return rb&&!rb.hidden?($p("rl").textContent||null):null}
function pres(){
 if(!room)return;
 var p={role:myRole(),cs:me?me.cs:null,x:me?Math.round(me.x*10)/10:null,y:me?Math.round(me.y*10)/10:null,z:me?Math.round(me.z):null,hd:me?Math.round(me.hd*100)/100:null,v:me?me.v:null,f:me?me.f:null};
 var s=JSON.stringify(p);if(s===lastPres)return;lastPres=s;room.presence(p).catch(function(){})}
function onPeers(ch){
 peersCache=ch.peers;setBadge();drawPeers();
 if(me){var mine=null;peersCache.forEach(function(p){if(p.isMe&&p.sameTab)mine=p});
  peersCache.forEach(function(p){if(!p.isMe&&p.presence&&p.presence.cs===me.cs&&mine&&p.peer<mine.peer){$p("pr").click();$p("pm").textContent="⚠ มีคนเลือกเครื่องนี้ก่อนแล้ว — เลือกเครื่องอื่น"}})}
 else if(!$p("pa").hidden){opts()}}

/* ---------- boot ---------- */
(async function(){
 if(!window.claude||!claude.use){setBadge();return}
 try{db=await claude.use("db")}catch(e){db=null}
 try{room=await claude.use("room")}catch(e){room=null}
 if(db){DBOK=true;
  db.collection("strips").onSnapshot(onStrips,function(e){DBOK=false;canWrite=false;setBadge()})}
 if(room){room.onPeers(onPeers,function(){});setInterval(pres,250);pres()}
 setBadge();
})();
})();
